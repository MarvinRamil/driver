<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Bee-driver Splash Screen</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS with Config -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f4ca25",
                        "background-light": "#f8f8f5",
                        "background-dark": "#221e10",
                    },
                    fontFamily: {
                        "display": ["Spline Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        /* Custom Utilities if needed, keeping it minimal */
        .safe-area-top {
            padding-top: env(safe-area-inset-top, 20px);
        }
        .safe-area-bottom {
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display bg-background-light dark:bg-background-dark text-background-dark dark:text-background-light antialiased overflow-hidden select-none">
<!-- Splash Screen Container -->
<!-- Note: We are forcing the primary yellow background here as per the splash screen design plan, 
         overriding the dark mode background for this specific screen to maintain brand identity. -->
<div class="relative flex h-screen w-full flex-col bg-primary items-center justify-between overflow-hidden">
<!-- Status Bar Placeholder (iOS Style) -->
<div class="absolute top-0 left-0 w-full px-6 py-3 flex justify-between items-end z-20 text-background-dark safe-area-top opacity-90">
<div class="text-sm font-semibold tracking-wide">9:41</div>
<div class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1, 'wght' 600, 'GRAD' 0, 'opsz' 24;">signal_cellular_alt</span>
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1, 'wght' 600, 'GRAD' 0, 'opsz' 24;">wifi</span>
<span class="material-symbols-outlined text-[18px] rotate-90" style="font-variation-settings: 'FILL' 1, 'wght' 600, 'GRAD' 0, 'opsz' 24;">battery_full</span>
</div>
</div>
<!-- Decorative Background Pattern (Subtle) -->
<!-- Hexagon pattern to hint at "Hive" theme without being overwhelming -->
<div class="absolute inset-0 z-0 opacity-10 pointer-events-none" style="background-image: radial-gradient(#221e10 1px, transparent 1px); background-size: 32px 32px;">
</div>
<!-- Main Content Area: Centered Logo -->
<div class="flex-1 flex flex-col items-center justify-center w-full z-10 px-8 relative">
<!-- Logo Container -->
<!-- Using a darker container or drop shadow to make the logo pop if it was transparent, 
                 but here we rely on the image contrast. -->
<div class="relative flex flex-col items-center justify-center transform transition-all duration-700">
<!-- Bee Logo Image -->
<!-- Ideally this would be a transparent PNG/SVG of a black bee shape -->
<div class="w-32 h-32 md:w-40 md:h-40 bg-background-dark rounded-3xl flex items-center justify-center shadow-xl mb-6 ring-4 ring-background-dark/10">
<span class="material-symbols-outlined text-primary text-[80px] md:text-[100px]" style="font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 48;">
                        local_taxi
                    </span>
</div>
<!-- Brand Name -->
<h1 class="text-4xl font-bold tracking-tight text-background-dark">BeeDriver</h1>
<!-- Tagline -->
<p class="mt-2 text-background-dark/80 text-lg font-medium tracking-wide">Drive with the Hive</p>
</div>
</div>
<!-- Bottom Section: Loading Indicator -->
<div class="w-full flex flex-col items-center pb-12 z-10 safe-area-bottom">
<!-- Custom Spinner Representation -->
<div class="relative w-8 h-8">
<svg class="animate-spin text-background-dark" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
<path class="opacity-75" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" fill="currentColor"></path>
</svg>
</div>
<div class="mt-4 text-xs font-semibold text-background-dark/50 uppercase tracking-widest">
                Loading Application
            </div>
</div>
</div>
</body></html>
