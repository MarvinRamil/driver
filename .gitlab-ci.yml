      echo "=== Checking app/build/outputs ==="
      ls -la app/build/outputs/bundle/release/ 2>/dev/null || echo "AAB directory not found"
      ls -la app/build/outputs/apk/release/ 2>/dev/null || echo "APK directory not found"
      
      # Use AAB for Play Store (preferred format)
      AAB_PATH=$(find app/build/outputs/bundle/release -name "app-release-staging_v*.aab" 2>/dev/null | head -1)
      if [ -z "$AAB_PATH" ]; then
        echo "AAB not found, trying APK as fallback..."
        APK_PATH=$(find app/build/outputs/apk/release -name "app-release-staging_v*.apk" 2>/dev/null | head -1)
        if [ -z "$APK_PATH" ]; then
          echo "Error: Neither AAB nor APK found!"
          echo "Current directory: $(pwd)"
          echo "Searching from root..."
          find ../ -name "*.aab" -o -name "*.apk" | head -10 || true
          exit 1
        fi
        # Convert to absolute path
        APK_PATH=$(realpath "$APK_PATH" 2>/dev/null || echo "$APK_PATH")
        echo "Deploying APK $APK_PATH to Internal Testing track..."
        fastlane deploy_internal apk_path:"$APK_PATH" || fastlane deploy_internal apk:"$APK_PATH"
      else
        # Convert to absolute path
        AAB_PATH=$(realpath "$AAB_PATH" 2>/dev/null || echo "$AAB_PATH")
        echo "Deploying AAB $AAB_PATH to Internal Testing track..."
        fastlane deploy_internal aab_path:"$AAB_PATH" || fastlane deploy_internal aab:"$AAB_PATH"
      fi
  when: manual
  environment:
    name: internal
    url: https://play.google.com/console/app/com.mybeeapp.driver/internal-testing

