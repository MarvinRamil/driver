stages:
  - build

build_expo_release_android:
  stage: build
  tags:
    - android
  before_script:
    - export ANDROID_HOME=/opt/android-sdk
    - export PATH=$PATH:/opt/android-sdk/cmdline-tools/latest/bin:/opt/android-sdk/platform-tools:/opt/android-sdk/build-tools/33.0.2:/opt/gradle-8.0.2/bin
    - node --version
    - java -version
    - npm install -g eas-cli
  script:
    - npm ci
    - npx expo prebuild --platform android
    - cd android
    - chmod +x gradlew
    # Build release APK (installable)
    - ./gradlew assembleRelease --no-daemon
  artifacts:
    paths:
      - android/app/build/outputs/apk/release/app-release.apk
    #expire_in: 14 days