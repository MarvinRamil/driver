      pwd
      echo "=== Looking for build files ==="
      find . -name "*.aab" -o -name "*.apk" | head -20 || true
      echo "=== Checking app/build/outputs ==="
      ls -la app/build/outputs/bundle/release/ 2>/dev/null || echo "AAB directory not found"
      ls -la app/build/outputs/apk/release/ 2>/dev/null || echo "APK directory not found"
      
      # Use AAB for Play Store (preferred format)
      AAB_PATH=$(find app/build/outputs/bundle/release -name "app-release.aab" 2>/dev/null | head -1)
      if [ -z "$AAB_PATH" ]; then
        echo "AAB not found, trying APK as fallback..."
        APK_PATH=$(find app/build/outputs/apk/release -name "app-release.apk" 2>/dev/null | head -1)
        if [ -z "$APK_PATH" ]; then
          echo "Error: Neither AAB nor APK found!"
          echo "Current directory: $(pwd)"
          echo "Searching from root..."
          find ../ -name "*.aab" -o -name "*.apk" | head -10 || true
          exit 1
        fi
        # Convert to absolute path
        APK_PATH=$(realpath "$APK_PATH" 2>/dev/null || echo "$APK_PATH")
        echo "Deploying APK $APK_PATH to Production track..."
        fastlane deploy_production apk_path:"$APK_PATH" || fastlane deploy_production apk:"$APK_PATH"
      else
        # Convert to absolute path
        AAB_PATH=$(realpath "$AAB_PATH" 2>/dev/null || echo "$AAB_PATH")
        echo "Deploying AAB $AAB_PATH to Production track..."
        fastlane deploy_production aab_path:"$AAB_PATH" || fastlane deploy_production aab:"$AAB_PATH"
      fi
  when: manual
  environment:
    name: production
    url: https://play.google.com/store/apps/details?id=com.mybeeapp.driver
